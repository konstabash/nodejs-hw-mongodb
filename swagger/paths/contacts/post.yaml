tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'William Mitchell'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000000002'
          email:
            description: "Contact's email"
            type: string
            format: email
            example: 'sample@email.com'
          isFavourite:
            description: 'Whether contact is added to favourites'
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: 'ID of the user who owns the contact'
            type: string
            example: 685f0a765740cd6f21ac8f9d
          photo:
            description: "Link to contact's photo"
            type: string
            example: https://res.cloudinary.com/dtxomyzoe/image/upload/v1752528465/csenuzcteawtloutc0z6.jpg
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '404':
    $ref: '../../components/responses/404.yaml'
